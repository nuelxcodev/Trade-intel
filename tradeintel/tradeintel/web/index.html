<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trading Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#000; --card:#0C0C0E; --card2:#070708; --line:#1E1E22; --sheet:#0B0B0D; --chartbg:#030304; --grid:#17171A;
  --card-a:#0E0E10; --card-b:#080809; --head-bg:rgba(0,0,0,.88); --nav-bg:rgba(8,8,9,.94); --scrim:rgba(0,0,0,.72);
  --fg:#F5F2EA; --muted:#9A968C; --faint:#6E6B63;
  --buy:#3DDC97; --sell:#FF9A3C; --gold:#F0383D; --gold-dim:rgba(240,56,61,.14); --gold-line:rgba(240,56,61,.4);
  --on-primary:#fff; --on-tag:#000; --ema1:#F5F2EA; --ema2:#7C86FF; --glow:rgba(240,56,61,.14);
  --warn:#F2B35A; --warn-bg:#1A120A; --bad-bg:#1F0A0B;
  --tab-h:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fff; --card:#fff; --card2:#F6F6F7; --line:#E6E6EA; --sheet:#fff; --chartbg:#FBFBFC; --grid:#EEEEF1;
  --card-a:#fff; --card-b:#FAFAFB; --head-bg:rgba(255,255,255,.9); --nav-bg:rgba(255,255,255,.95); --scrim:rgba(20,20,25,.45);
  --fg:#16161A; --muted:#62626C; --faint:#8E8E98;
  --buy:#0E9F63; --sell:#D9650B; --gold:#D8141C; --gold-dim:rgba(216,20,28,.08); --gold-line:rgba(216,20,28,.35);
  --on-primary:#fff; --on-tag:#fff; --ema1:#16161A; --ema2:#4A55E0; --glow:rgba(216,20,28,.07);
  --warn:#9A5B00; --warn-bg:#FFF6E5; --bad-bg:#FFEDEE;
  color-scheme:light;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#fff; --card:#fff; --card2:#F6F6F7; --line:#E6E6EA; --sheet:#fff; --chartbg:#FBFBFC; --grid:#EEEEF1;
  --card-a:#fff; --card-b:#FAFAFB; --head-bg:rgba(255,255,255,.9); --nav-bg:rgba(255,255,255,.95); --scrim:rgba(20,20,25,.45);
  --fg:#16161A; --muted:#62626C; --faint:#8E8E98;
  --buy:#0E9F63; --sell:#D9650B; --gold:#D8141C; --gold-dim:rgba(216,20,28,.08); --gold-line:rgba(216,20,28,.35);
  --on-primary:#fff; --on-tag:#fff; --ema1:#16161A; --ema2:#4A55E0; --glow:rgba(216,20,28,.07);
  --warn:#9A5B00; --warn-bg:#FFF6E5; --bad-bg:#FFEDEE;
  color-scheme:light;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:14px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;
  background:var(--bg) radial-gradient(520px 260px at 50% -90px,var(--glow),transparent 70%) no-repeat}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header{position:sticky;top:0;z-index:20;background:var(--head-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.hr{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--buy)} .dot.bad{background:var(--sell)} .dot.wait{background:var(--warn)}
main{flex:1;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.view{display:none;flex-direction:column;gap:16px}
.view.on{display:flex}
button,a{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.iconbtn:active{background:var(--gold-dim)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:30;
  background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr)}
nav a{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:.02em;position:relative}
nav a[aria-current="page"]{color:var(--gold)}
nav a[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--gold)}
.badge-n{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--on-primary);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.card{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card.tap{display:block;width:100%;text-align:left}
.card.tap:active{border-color:var(--gold-line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:500}
.muted{color:var(--muted)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums}
.buy{color:var(--buy)} .sell{color:var(--sell)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip.on{color:var(--on-primary);background:var(--gold);border-color:var(--gold)}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid currentColor;white-space:nowrap}
.pill.buy{background:color-mix(in srgb,var(--buy) 12%,transparent)} .pill.sell{background:color-mix(in srgb,var(--sell) 12%,transparent)}
.pill.gold{color:var(--gold);background:var(--gold-dim)} .pill.grey{color:var(--muted)}
.banner{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.banner.bad{border-color:color-mix(in srgb,var(--sell) 50%,transparent);background:var(--bad-bg);color:var(--sell)}
.banner b{font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip .card{padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.strip b{font-size:20px;font-weight:300;letter-spacing:-.02em}
.opp{display:flex;flex-direction:column;gap:12px}
.opp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sym{font-size:17px;font-weight:600;letter-spacing:-.01em}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:15px;font-weight:500}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.lv b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.lv .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.lv .sl b{color:var(--sell)} .lv .tp b{color:var(--buy)} .lv .en b{color:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.empty{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:28px 20px}
.empty strong{font-size:17px;font-weight:600}
.empty .icon{width:36px;height:36px;color:var(--gold)}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;min-height:36px;display:flex;align-items:center}
details ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;text-align:left}
.q{display:grid;grid-template-columns:minmax(0,1.3fr) 64px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);min-height:60px}
.q .p{text-align:right}
.q b{font-weight:600;font-size:15px}
.chg{font-size:12px;font-weight:600}
.list{display:flex;flex-direction:column}
.bar-pos{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--sell) 55%,transparent) 0 var(--e),color-mix(in srgb,var(--buy) 55%,transparent) var(--e) 100%);margin:10px 0 4px}
.bar-pos i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--fg);border:3px solid var(--bg);transform:translateX(-50%);left:var(--x)}
.bar-pos u{position:absolute;top:-3px;width:2px;height:12px;background:var(--gold);left:var(--e)}
.bar-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.chart-wrap{display:flex;flex-direction:column;gap:8px}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:var(--chartbg);border-radius:14px;border:1px solid var(--line)}
.readout{min-height:20px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.pricebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pricebar .big{font-size:30px;font-weight:300;letter-spacing:-.03em}
.ticket{display:flex;flex-direction:column;gap:12px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.trow:last-child{border-bottom:0}
.trow span{color:var(--muted);font-size:13px}
.trow b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;border-radius:14px;border:1px solid var(--line);font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.pri{background:var(--gold);color:var(--on-primary);border-color:var(--gold)}
.btn:active{opacity:.8}
.action{border-radius:14px;padding:12px 14px;background:var(--gold-dim);border:1px solid var(--gold-line);font-size:13.5px;line-height:1.5}
.timeline{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .d{width:13px;height:13px;border-radius:50%;background:var(--gold);margin-top:4px}
.timeline .d.g{background:var(--buy)} .timeline .d.r{background:var(--sell)} .timeline .d.n{background:var(--faint)}
dialog{border:0;padding:0;background:transparent;color:var(--fg);max-width:560px;width:100%;margin:auto 0 0;margin-left:auto;margin-right:auto;max-height:88dvh}
dialog::backdrop{background:var(--scrim)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:88dvh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:19px;font-weight:600}
.sheet h3{margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:500}
.sheet ul.why{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
input[type=password],textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
textarea{min-height:140px;resize:none}
.mrow{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;font-size:13px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.alert{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.alert:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--on-primary);font-weight:500;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}

.iconbtn .sun{display:none}
:root[data-theme="light"] .iconbtn .sun{display:block}
:root[data-theme="light"] .iconbtn .moon{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .iconbtn .sun{display:block}:root:not([data-theme="dark"]) .iconbtn .moon{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1 id="title">Signals</h1>
  <div class="hr">
    <span class="live" id="live"><span class="dot wait"></span><span>Connecting</span></span>
    <button class="iconbtn" id="theme" type="button" aria-label="Switch theme"><svg class="icon moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg></button>
    <button class="iconbtn" id="refresh" type="button" aria-label="Refresh"><svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>
</header>

<main>
  <section class="view" id="v-signals" aria-label="Signals"></section>
  <section class="view" id="v-markets" aria-label="Markets"></section>
  <section class="view" id="v-chart" aria-label="Chart"></section>
  <section class="view" id="v-history" aria-label="History"></section>
  <section class="view" id="v-more" aria-label="More"></section>
</main>

<nav aria-label="Main">
  <a href="#/signals" data-tab="signals"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Signals</a>
  <a href="#/markets" data-tab="markets"><svg class="icon" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Markets</a>
  <a href="#/chart" data-tab="chart"><svg class="icon" viewBox="0 0 24 24"><path d="M6 4v16M6 8h-2v6h2M6 8h2v6H6M18 3v18M18 7h-2v8h2M18 7h2v8h-2M12 6v12M12 9h-2v5h2M12 9h2v5h-2"/></svg>Chart</a>
  <a href="#/history" data-tab="history"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
  <a href="#/more" data-tab="more"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>More<span class="badge-n" id="alertBadge" hidden></span></a>
</nav>
</div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'ti_key', REFRESH = 30000;
  var S = {tf:null, tfs:[], ov:null, opps:null, market:null, signals:[], perf:null, models:[], notes:[],
           symbol:null, candles:{}, nCandles:90, filter:'all', loaded:false, view:'signals', cross:null};

  /* ---------- theme ---------- */
  var C = {}, TKEY = 'ti_theme';
  function readPal(){ var cs = getComputedStyle(document.documentElement), g = function(n){ return cs.getPropertyValue(n).trim(); };
    C = {buy:g('--buy'), sell:g('--sell'), gold:g('--gold'), ema1:g('--ema1'), ema2:g('--ema2'), grid:g('--grid'), muted:g('--muted'), line:g('--line'), ontag:g('--on-tag')};
    var tc = $('themeColor'); if (tc) tc.setAttribute('content', g('--bg')); }
  function isLight(){ var t = document.documentElement.getAttribute('data-theme'); return t ? t === 'light' : matchMedia('(prefers-color-scheme: light)').matches; }
  function setTheme(t){ document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem(TKEY, t); } catch(e){} readPal(); if (typeof render === 'function') render(); }
  try { var saved = localStorage.getItem(TKEY); if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved); } catch(e){}
  readPal();
  try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ if (!document.documentElement.getAttribute('data-theme')) { readPal(); render(); } }); } catch(e){}

  /* ---------- helpers ---------- */
  function getKey(){ try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; } }
  function setKey(k){ try { k ? localStorage.setItem(KEY,k) : localStorage.removeItem(KEY); } catch(e){} }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(x){
    if (x == null || !isFinite(x)) return '–';
    var a = Math.abs(x), dp = a >= 1000 ? 2 : a >= 10 ? 3 : a >= 1 ? 4 : 6;
    return Number(x).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:dp});
  }
  function money(x){ return x == null || !isFinite(x) ? '–' : Number(x).toLocaleString('en-US',{maximumFractionDigits:2}); }
  function pct(x, dp){ return x == null || !isFinite(x) ? '–' : (x*100).toFixed(dp == null ? 0 : dp) + '%'; }
  function ago(sec){ if (sec == null) return 'never'; if (sec < 90) return sec + 's ago'; if (sec < 5400) return Math.round(sec/60) + ' min ago'; return Math.round(sec/3600) + ' h ago'; }
  function when(sec){ return new Date(sec*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function side(d){ return d === 'LONG' ? 'BUY' : 'SELL'; }
  function sideCls(d){ return d === 'LONG' ? 'buy' : 'sell'; }
  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('on'); }, 1800); }
  var ICON = {
    bolt:'<svg class="icon" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
    clock:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    chev:'<svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
    down:'<svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    copy:'<svg class="icon" style="width:18px;height:18px" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',

      '<div class="opp-top"><div><div class="sym">'+esc(s.symbol)+' <span class="muted small" style="font-weight:400">'+esc(s.tf)+'</span></div><div style="margin-top:4px"><span class="pill '+sideCls(s.direction)+'">'+side(s.direction)+'</span></div></div>' + statusPill(s.state.status) + '</div>' +

  function drawChart(candles, p){
    if (!candles.length) return '<div class="card empty"><span class="muted">No candles stored for this pair yet.</span></div>';

      if (p.entry_lo != null) s += '<rect x="0" y="'+R(Math.min(y(p.entry_lo),y(p.entry_hi)))+'" width="'+PW+'" height="'+Math.max(1.5,R(Math.abs(y(p.entry_lo)-y(p.entry_hi))))+'" fill="'+C.gold+'" fill-opacity=".16"/>';
    }
    candles.forEach(function(c,i){
      var x = step*i + step/2, up = c.c >= c.o, col = up ? ''+C.buy+'' : ''+C.sell+'', top = y(Math.max(c.o,c.c)), hh = Math.max(1.2, Math.abs(y(c.o)-y(c.c))), bw = Math.max(1.4, step*.64);
      s += '<line x1="'+R(x)+'" x2="'+R(x)+'" y1="'+R(y(c.h))+'" y2="'+R(y(c.l))+'" stroke="'+col+'" stroke-width="1"/><rect x="'+R(x-bw/2)+'" y="'+R(top)+'" width="'+R(bw)+'" height="'+R(hh)+'" fill="'+(up?'#030304':col)+'" stroke="'+col+'" stroke-width="1"/>';
    });
    function line(k, col){ var pts = candles.map(function(c,i){ return c[k] == null ? null : R(step*i+step/2)+','+R(y(c[k])); }).filter(Boolean); return pts.length > 1 ? '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.2" stroke-opacity=".85"/>' : ''; }
    s += line('ema20',''+C.ema1+'') + line('ema50',''+C.ema2+'');
    // level lines and de-overlapped tags
    var tags = lv.map(function(l){ return {y:y(l[0]), ty:y(l[0]), l:l}; }).sort(function(a,b){ return a.y - b.y; });
    for (var i = 1; i < tags.length; i++) if (tags[i].ty - tags[i-1].ty < 13) tags[i].ty = tags[i-1].ty + 13;
    tags.forEach(function(t){
      s += '<line x1="0" x2="'+PW+'" y1="'+R(t.y)+'" y2="'+R(t.y)+'" stroke="'+t.l[2]+'" stroke-width="1.2" stroke-dasharray="'+(t.l[1]==='Entry'?'0':'5 4')+'"/>';
      s += '<rect x="'+(PW+1)+'" y="'+R(t.ty-7)+'" width="'+(W-PW-1)+'" height="14" rx="3" fill="'+t.l[2]+'"/><text x="'+(PW+4)+'" y="'+R(t.ty+3)+'" font-size="9" font-weight="600" fill="'+C.ontag+'">'+t.l[1]+' '+esc(fmt(t.l[0]))+'</text>';
    });
    s += '<line id="xh" x1="0" x2="0" y1="0" y2="'+H+'" stroke="'+C.muted+'" stroke-dasharray="3 3" visibility="hidden"/>';
    return '<svg class="chart" id="chartSvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Candlestick chart">'+s+'</svg>';
  }
  function wireCrosshair(candles){

  function openPairSheet(){
    var syms = (S.ov && S.ov.symbols) || [];
    sheet('<h2>Choose a pair</h2><div class="list">' + syms.map(function(s){ return '<button type="button" class="setrow" data-pick="'+esc(s)+'"><b>'+esc(s)+'</b><span class="muted small">'+esc(fmt(priceOf(s)))+'</span></button>'; }).join('') + '</div>');
    $('sheetBody').querySelectorAll('[data-pick]').forEach(function(b){ b.onclick = function(){ closeSheet(); openChart(b.dataset.pick); }; });
  }
  function openWhySheet(p){
    var ev = p.evidence || {}, comps = Object.entries(p.components || {}).sort(function(a,b){ return b[1]-a[1]; }), nb = ev.neighbours || {}, d = p.direction === 'LONG' ? 'long' : 'short', mk = ev.market || {};
    var names = {model:'AI confidence', similarity:'Match with history', structure:'Trend and structure', volume:'Trading volume', volatility:'Calm enough to trade', liquidity:'Liquidity', risk_reward:'Reward vs risk'};
    var why = [];
    if (comps.length) why.push('Strongest points: ' + comps.slice(0,3).map(function(c){ return (names[c[0]]||c[0]) + ' (' + Math.round(c[1]*100) + '%)'; }).join(', ') + '.');
    if (nb.k) why.push('We found ' + nb.k + ' similar moments in the past. ' + pct(nb[d+'_success']) + ' of them reached the target before the stop, compared with ' + pct(ev.base_rate) + ' if you entered at random.');
    why.push('The model estimates a ' + pct(p.probability) + ' chance' + (p.threshold ? ' (it only speaks up above ' + pct(p.threshold) + ')' : '') + '. That is an estimate from past data, not a guarantee.');
    if (mk.adx != null) why.push('Trend strength is ' + mk.adx.toFixed(0) + ' (above 25 is a strong trend), volume is ' + (mk.rel_vol||0).toFixed(1) + 'x normal, and volatility is ' + (mk.atr_ratio||0).toFixed(2) + 'x its recent average.');
    var pats = Object.keys(ev.patterns_now || {}); if (pats.length) why.push('Pattern on the latest candle: ' + pats.map(function(x){ return x.replace(/_/g,' '); }).join(', ') + '.');
    var lv = (ev.trade_notes || []);
    sheet('<h2>Why '+esc(p.symbol)+'?</h2><div><h3>Reasons</h3><ul class="why">'+why.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('')+'</ul></div>' +
      (lv.length ? '<div><h3>How the levels were set</h3><ul class="why">'+lv.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('')+'</ul></div>' : '') +
      ((p.invalidation||[]).length ? '<div><h3>Cancel the trade if</h3><ul class="why">'+p.invalidation.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('')+'</ul></div>' : '') +
      '<div class="small muted">Written from the engines\' stored numbers. No language model is involved and nothing is invented.</div><button class="btn" type="button" id="closeSheet">Close</button>');
    $('closeSheet').onclick = closeSheet;
  }
  function levelsText(p){
    return [side(p.direction)+' '+p.symbol+' ('+p.tf+')', 'Entry: '+fmt(p.entry)+' (zone '+fmt(p.entry_lo)+' to '+fmt(p.entry_hi)+')', 'SL: '+fmt(p.sl), 'TP1: '+fmt(p.tp1), 'TP2: '+fmt(p.tp2), 'TP3: '+fmt(p.tp3),
      'Reward vs risk: '+Number(p.rr).toFixed(2)+' : 1', 'Size: '+fmt(p.qty)+' units, risk '+money(p.risk_amount)].join('\n');
  }
  function copyLevels(p){
    var t = levelsText(p);
    var done = function(){ toast('Levels copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, fallback); } else fallback();
    function fallback(){ sheet('<h2>Copy levels</h2><div class="small muted">Select the text below and copy it.</div><textarea id="ta" readonly>'+esc(t)+'</textarea><button class="btn" type="button" id="closeSheet">Close</button>'); $('ta').focus(); $('ta').select(); $('closeSheet').onclick = closeSheet; }
  }
  async function openSignalSheet(id){
    var sg = S.signals.filter(function(x){ return x.id === id; })[0]; if (!sg) return;
    var hist = [];
    try { hist = (await api('/api/signals/' + encodeURIComponent(id))).history || []; } catch(e){}
    var perfRow = ((S.perf && S.perf.signals) || []).filter(function(r){ return r.id === id; })[0];
    var res = perfRow && perfRow.state === 'closed' ? (perfRow.r_net >= 0 ? '+' : '') + perfRow.r_net.toFixed(2) + ' R' : perfRow && perfRow.state === 'no_entry' ? 'Never entered' : 'In progress';
    var p = fromSignal(sg);
    var dcls = function(s){ return /TP/.test(s) || s === 'ACTIVE' ? 'g' : s === 'STOP LOSS HIT' ? 'r' : /INVALID|EXPIRED|ANALYS/.test(s) ? 'n' : ''; };
    sheet('<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2>'+esc(sg.symbol)+' <span class="pill '+sideCls(sg.direction)+'" style="vertical-align:middle">'+side(sg.direction)+'</span></h2>'+statusPill(sg.state.status)+'</div>' +
      '<div>'+row('Result', res)+row('Entry', fmt(sg.entry))+row('Stop loss', fmt(sg.sl), 'var(--sell)')+row('Take profit 1 / 2 / 3', fmt(sg.tp1)+' / '+fmt(sg.tp2)+' / '+fmt(sg.tp3), 'var(--buy)')+row('Opened', when(sg.created_at))+'</div>' +
      '<div><h3>What happened</h3><ul class="timeline" style="margin-top:10px">'+hist.map(function(e){ var m = STATUS[e.status]||[e.status]; return '<li><span class="d '+dcls(e.status)+'"></span><div><b>'+esc(m[0])+'</b>'+(e.price!=null?' <span class="muted num">at '+esc(fmt(e.price))+'</span>':'')+'<div class="small muted">'+esc(e.note||'')+'</div></div></li>'; }).join('')+'</ul></div>' +
      '<div class="btnrow"><button class="btn" type="button" id="whyBtn">'+ICON.info+'Why</button><button class="btn pri" type="button" id="chartBtn">Open chart</button></div>');
    $('whyBtn').onclick = function(){ openWhySheet(p); };
    $('chartBtn').onclick = function(){ closeSheet(); openChart(sg.symbol); };
  }

  /* ---------- History ---------- */
  function renderHistory(){
    var el = $('v-history'), o = (S.perf && S.perf.overall) || {}, rows = {};
    ((S.perf && S.perf.signals) || []).forEach(function(r){ rows[r.id] = r; });
    var h = '<div class="strip"><div class="card"><span class="label">Win rate</span><b class="num">'+(o.trades ? pct(o.win_rate) : '–')+'</b></div><div class="card"><span class="label">Profit factor</span><b class="num">'+(o.trades ? (isFinite(o.profit_factor) ? o.profit_factor.toFixed(2) : '∞') : '–')+'</b></div><div class="card"><span class="label">Total result</span><b class="num '+(o.trades ? (o.total_r >= 0 ? 'buy' : 'sell') : '')+'">'+(o.trades ? (o.total_r>=0?'+':'')+o.total_r.toFixed(1)+'R' : '–')+'</b></div></div>';
    h += '<div class="small muted">R is your risk unit: +2R means you made twice what you risked. Results include fees and slippage. '+(o.trades ? o.trades + ' finished trade' + (o.trades===1?'':'s') + (o.no_entry ? ', ' + o.no_entry + ' never entered' : '') + '.' : 'No trades have finished yet.')+'</div>';
    h += '<div class="chips" role="group" aria-label="Filter">' + [['all','All'],['open','Open'],['closed','Finished']].map(function(f){ return '<button class="chip" type="button" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'; }).join('') + '</div>';
    var list = S.signals.filter(function(s){ var c = !!CLOSED[s.state.status]; return S.filter === 'all' || (S.filter === 'open' ? !c : c); });
    if (!list.length) h += '<div class="card empty">'+ICON.clock+'<strong>Nothing here yet</strong><span class="muted">Signals appear here with their full history once the scanner finds a qualified setup.</span></div>';
    else {
      h += '<div class="card" style="padding:4px 16px"><div class="list">';
      list.forEach(function(s){
        var r = rows[s.id], res = r && r.state === 'closed' ? (r.r_net >= 0 ? '+' : '') + r.r_net.toFixed(2)+' R' : '', cls = r && r.state === 'closed' ? (r.r_net >= 0 ? 'buy' : 'sell') : 'muted';
        h += '<button type="button" class="q" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto" data-sig="'+esc(s.id)+'"><div><b>'+esc(s.symbol)+'</b> <span class="pill '+sideCls(s.direction)+'" style="padding:1px 8px;font-size:10px">'+side(s.direction)+'</span><div class="small muted">'+esc(when(s.created_at))+' · '+esc(s.tf)+'</div></div><div>'+statusPill(s.state.status)+'</div><b class="num '+cls+'">'+esc(res)+'</b></button>';
      });
      h += '</div></div>';
    }
    var pats = Object.entries((S.perf && S.perf.by_pattern) || {}).filter(function(e){ return e[1].trades; }).sort(function(a,b){ return b[1].trades - a[1].trades; });
    if (pats.length){
      h += '<div class="sec"><h2>By pattern</h2></div><div class="card" style="display:flex;flex-direction:column;gap:14px">' + pats.map(function(e){
        return '<div><div style="display:flex;justify-content:space-between"><span>'+esc(e[0].replace(/_/g,' '))+'</span><b class="num">'+pct(e[1].win_rate)+'</b></div><div style="height:6px;border-radius:3px;background:'+C.line+';margin:6px 0 2px"><div style="height:6px;border-radius:3px;width:'+Math.round(e[1].win_rate*100)+'%;background:'+C.gold+'"></div></div><span class="small muted">'+e[1].trades+' finished trade'+(e[1].trades===1?'':'s')+'</span></div>';
      }).join('') + '</div>';
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ S.filter = b.dataset.f; renderHistory(); }; });
    el.querySelectorAll('[data-sig]').forEach(function(b){ b.onclick = function(){ openSignalSheet(b.dataset.sig); }; });
  }

  /* ---------- More ---------- */
  function renderMore(){
    var el = $('v-more'), ov = S.ov, w = ov.worker || {}, lc = ov.last_cycle || {}, h = '';
    var ready = ov.models_with_edge || 0;
    h += '<div class="card"><div class="sec" style="margin-top:0"><h2>Is the AI ready?</h2><span class="pill '+(ready ? 'buy' : 'gold')+'">'+(ready ? ready + ' of ' + ov.models + ' ready' : 'Not yet')+'</span></div>' +
      '<p class="small muted" style="margin:8px 0 4px">A model may only raise signals after beating chance on price data it never trained on. Until then the app stays quiet instead of guessing.</p>';
    if (!S.models.length) h += '<div class="small muted" style="padding:8px 0">No models trained yet.</div>';
    else h += '<div class="mrow label"><span>Pair</span><span>Buy side</span><span>Sell side</span></div>' + S.models.map(function(m){
      function cell(k){ return m.usable[k] ? '<span class="buy" style="font-weight:600">Ready</span>' : '<span class="muted">Learning</span>'; }
      return '<div class="mrow"><span><b>'+esc(m.symbol)+'</b> <span class="muted small">'+esc(m.tf)+'</span></span>'+cell('long')+cell('short')+'</div>';
    }).join('');
    h += '</div>';

    var probs = [];
    Object.keys(lc).forEach(function(tf){
      Object.entries(lc[tf].sync_errors || {}).forEach(function(e){ probs.push('<div class="banner bad"><b>'+esc(e[0])+' ('+esc(tf)+') could not download</b><span>'+esc(e[1])+'</span></div>'); });
      Object.entries(lc[tf].model_notes || {}).forEach(function(e){ probs.push('<div class="banner"><b>'+esc(e[0])+' ('+esc(tf)+') is waiting</b><span>'+esc(e[1])+'</span></div>'); });
    });
    h += '<div class="card"><div class="sec" style="margin-top:0"><h2>System</h2><span class="live"><span class="dot '+(w.last_error ? 'bad' : w.cycles ? 'ok' : 'wait')+'"></span>'+(w.last_error ? 'Problem' : w.cycles ? 'Running' : 'Starting')+'</span></div>' +
      '<div>'+row('Exchange', (ov.exchange||'').toUpperCase())+row('Pairs watched', String(ov.monitored_pairs))+row('Timeframes', (ov.timeframes||[]).join(', '))+row('Last update', w.cycles ? ago(w.last_cycle_seconds_ago) : 'in progress')+row('Updates run', String(w.cycles||0))+'</div>' +
      (w.last_error ? '<div class="banner bad" style="margin-top:8px"><b>Last error</b><span>'+esc(w.last_error)+'</span></div>' : '') + '</div>';
    if (probs.length) h += '<div class="sec"><h2>Needs attention</h2></div>' + probs.join('');

    h += '<div class="sec"><h2>Alerts</h2></div><div class="card">' + (S.notes.length ? S.notes.slice(0,8).map(function(n){
      return '<button type="button" class="alert" style="width:100%;text-align:left" data-note="'+n.id+'"><b>'+esc(n.title)+'</b><span class="small muted">'+esc(when(n.created_at))+'</span></button>';
    }).join('') : '<div class="small muted">No alerts yet. When a qualified setup appears you will see it here, and on Telegram or email if those are set up on the server.</div>') + '</div>';

    h += '<div class="card" style="padding:4px 16px"><button type="button" class="setrow" id="keyBtn"><span>Access key</span><span class="muted small">'+(getKey() ? 'Saved' : 'Not set')+'</span></button></div>';
    h += '<div class="small muted" style="line-height:1.6">Trading Intelligence is a decision-support tool. It does not place orders and is not financial advice. Probabilities are estimates from past data and are not guaranteed. Never risk money you cannot afford to lose.</div>';
    el.innerHTML = h;
    $('keyBtn').onclick = openKey;
    el.querySelectorAll('[data-note]').forEach(function(b){ b.onclick = function(){ var n = S.notes.filter(function(x){ return String(x.id) === b.dataset.note; })[0]; if (!n) return;
      sheet('<h2>'+esc(n.title)+'</h2><div class="small muted">'+esc(when(n.created_at))+'</div><div style="white-space:pre-wrap;font-size:13.5px;line-height:1.6">'+esc(n.body)+'</div><button class="btn" type="button" id="closeSheet">Close</button>'); $('closeSheet').onclick = closeSheet; }; });
  }
  function openKey(){ sheet('<h2>Access key</h2><div class="small muted">This server asks for its API key. It is stored in this browser only.</div><input type="password" id="keyInput" autocomplete="off" aria-label="Access key"><div class="btnrow"><button class="btn" type="button" id="keyClear">Remove</button><button class="btn pri" type="button" id="keySave">Save</button></div>');
    $('keyInput').focus(); $('keySave').onclick = function(){ setKey($('keyInput').value.trim()); closeSheet(); load(true); }; $('keyClear').onclick = function(){ setKey(''); closeSheet(); renderMore(); }; }

  /* ---------- routing ---------- */
  var TITLES = {signals:'Signals', markets:'Markets', chart:'Chart', history:'History', more:'More'};
  function route(){
    var parts = (location.hash || '#/signals').replace(/^#\//,'').split('/'), v = TITLES[parts[0]] ? parts[0] : 'signals';
    if (v === 'chart' && parts[1]) S.symbol = decodeURIComponent(parts[1]);
    S.view = v; closeSheet();
    document.querySelectorAll('.view').forEach(function(x){ x.classList.toggle('on', x.id === 'v-' + v); });
    document.querySelectorAll('nav a').forEach(function(a){ if (a.dataset.tab === v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    $('title').textContent = v === 'chart' && S.symbol ? S.symbol : TITLES[v];
    window.scrollTo(0, 0);
    render();
  }
  function render(){
    if (!S.loaded) return;
    ({signals:renderSignals, markets:renderMarkets, chart:renderChart, history:renderHistory, more:renderMore})[S.view]();
    var unread = S.notes.filter(function(n){ return !n.read; }).length, b = $('alertBadge');
    b.hidden = !unread; b.textContent = unread > 9 ? '9+' : unread;
  }
  window.addEventListener('hashchange', route);

  /* ---------- loading ---------- */
  var busy = false;
  async function load(force){
    if (busy && !force) return; busy = true;
    try {
      var ov = await api('/api/overview'); S.ov = ov; S.tfs = ov.timeframes || [];
      if (!S.tf || S.tfs.indexOf(S.tf) < 0) S.tf = S.tfs[0];
      var r = await Promise.all([api('/api/opportunities?tf='+S.tf), api('/api/market?tf='+S.tf), api('/api/signals?limit=60'), api('/api/performance'), api('/api/models'), api('/api/notifications?user=default').catch(function(){ return {notifications:[]}; })]);
      S.opps = r[0]; S.market = r[1]; S.signals = r[2].signals; S.perf = r[3]; S.models = r[4].models; S.notes = r[5].notifications || [];
      S.loaded = true;
      var w = ov.worker || {};
      $('live').innerHTML = '<span class="dot '+(w.last_error ? 'bad' : w.cycles ? 'ok' : 'wait')+'"></span><span>'+(w.cycles ? ago(w.last_cycle_seconds_ago) : 'Starting')+'</span>';
      render();
    } catch(e){
      if (e.auth){ $('live').innerHTML = '<span class="dot bad"></span><span>Key needed</span>'; if (!$('sheet').open) openKey(); }
      else { $('live').innerHTML = '<span class="dot bad"></span><span>Offline</span>'; if (!S.loaded) $('v-signals').innerHTML = '<div class="card empty"><strong>Cannot reach the server</strong><span class="muted">Check your connection and tap refresh.</span></div>'; }
    } finally { busy = false; }
  }
  $('theme').onclick = function(){ setTheme(isLight() ? 'dark' : 'light'); };
  $('refresh').onclick = function(){ S.candles = {}; load(true); toast('Refreshing'); };
  route(); load();
  setInterval(function(){ if (!document.hidden) load(); }, REFRESH);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
